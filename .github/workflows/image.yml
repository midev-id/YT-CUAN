name: agent image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: t
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yt-cuan-agent
          ver=${GITHUB_REF_NAME}; [ "$GITHUB_REF_TYPE" = tag ] || ver=main-${GITHUB_SHA::7}
          echo "img=$img" >> "$GITHUB_OUTPUT"; echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: APP_VERSION=${{ steps.t.outputs.ver }}
          tags: |
            ${{ steps.t.outputs.img }}:latest
            ${{ steps.t.outputs.img }}:${{ steps.t.outputs.ver }}
